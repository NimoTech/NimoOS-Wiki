project_name: nimoos-wiki

before:
  hooks:
    - go mod tidy

builds:
  - id: nimoos-wiki
    main: .
    binary: nimoos-wiki
    ldflags:
      - -s -w
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    # CGO cross-compilation: arm64 requires gcc-aarch64-linux-gnu toolchain on the build host

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - build/sysroot/**

checksum:
  name_template: "checksums.txt"

snapshot:
  name_template: "{{ incpatch .Version }}-next"
